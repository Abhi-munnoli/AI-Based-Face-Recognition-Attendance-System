<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>{% block title %}AI Attendance{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg glass-nav">
 <div class="container-fluid px-4"><a class="navbar-brand fw-bold" href="/">AI<span>ATTEND</span></a>
 <div class="d-flex align-items-center gap-2"><a class="btn btn-sm btn-outline-light" href="/login">Login</a><button class="btn btn-sm btn-danger d-none" id="logoutBtn">Logout</button></div>
 </div>
</nav>
<div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>
{% block content %}{% endblock %}
<script>window.CSRF_TOKEN={{ csrf_token()|tojson }};</script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body></html>
