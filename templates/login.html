{% extends 'base.html' %}{% block title %}Secure Login{% endblock %}
{% block content %}<div class="auth-wrap"><div class="auth-card"><div class="text-center mb-4"><div class="security-icon"><i class="bi bi-shield-lock"></i></div><h2>Secure Access</h2><p class="text-secondary">Sign in with your Firebase account</p></div><form id="loginForm"><label class="form-label">Email</label><input id="email" class="form-control form-control-lg mb-3" type="email" required autocomplete="email"><label class="form-label">Password</label><div class="input-group mb-3"><input id="password" class="form-control form-control-lg" type="password" required autocomplete="current-password"><button class="btn btn-outline-secondary" type="button" id="togglePassword"><i class="bi bi-eye"></i></button></div><button class="btn btn-primary btn-lg w-100" id="loginBtn">Sign In</button><div id="loginError" class="alert alert-danger mt-3 d-none"></div></form><p class="small text-secondary mt-4 mb-0">Admin and student accounts are managed through Firebase Authentication.</p></div></div>{% endblock %}
{% block scripts %}<script type="module" src="{{ url_for('static', filename='js/auth.js') }}"></script>{% endblock %}
